<section class="person-credits">
  <h2>{{creditsTitle()}}</h2>
  <div class="row">
    <div class="col-12 col-lg-6">
      <div class="d-grid">
        <a
          [routerLink]="['/person', person().id, 'cast-credits']"
          class="btn btn-light border-dark mb-2"
        >
          {{ viewCastCreditsText() }}
        </a>
      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="d-grid">
        <a
          [routerLink]="['/person', person().id, 'crew-credits']"
          class="btn btn-light border-dark mb-2"
        >
          {{ viewCrewCreditsText() }}
        </a>
      </div>
    </div>
  </div>
</section>
