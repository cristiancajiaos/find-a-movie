@if (person().biography) {
  <section class="person-biography">
    <h2>{{biographyTitle()}}</h2>
    <p>{{ person().biography }}</p>
  </section>
  <section class="person-links">
    <div class="row">
      <div class="col-12 col-lg-6">
        <div class="d-grid">
          <a [routerLink]="['/person', person().id, 'cast-credits']" class="btn btn-light border-dark mb-2">
            {{viewCastCreditsText()}}
          </a>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="d-grid">
          <a [routerLink]="['/person', person().id, 'crew-credits']" class="btn btn-light border-dark mb-2">
            {{viewCrewCreditsText()}}
          </a>
        </div>
      </div>
    </div>
  </section>
} @else {
  <section class="no-person-biography-available">
    <p>{{noBiographyText()}}</p>
  </section>
}
