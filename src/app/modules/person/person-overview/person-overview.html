<section class="person-overview">
  @if (personErrorFound()) {
    <app-person-error [errorMessage]="errorMessage()" (reload)="reloadOverview($event)">
    </app-person-error>
  } @else {
    @if (personFound()) {
      <div class="row">
        <div class="col-12 col-lg-8">
          <app-person-biography [person]="person()"></app-person-biography>
        </div>
        <div class="col-12 col-lg-4">
          <section class="person-infotable">
            <app-person-infotable [person]="person()"></app-person-infotable>
          </section>
        </div>
        <div class="col-12">
          <hr />
          <app-person-credits [person]="person()"></app-person-credits>
          <hr />
          <app-person-external-links [person]="person()"></app-person-external-links>
        </div>
      </div>
    }
  }
</section>
