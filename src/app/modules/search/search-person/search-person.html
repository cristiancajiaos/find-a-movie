<section class="search-person">
  @if (searchError()) {
    <app-search-error-fullscreen
      [errorMessage]="errorMessage()"
      [searchQuery]="searchQuery()"
      (reload)="handleReloadError()"
    >
    </app-search-error-fullscreen>
  } @else {
    <header #header>
      <h1>
        <fa-icon [icon]="searchIcon"></fa-icon>
        {{ searchPersonTitle() }}
      </h1>
      <h2>
        <fa-icon [icon]="userIcon"></fa-icon>
        {{ searchQuery() }}
      </h2>
    </header>
    <main>
      <div class="container-fluid">
        @if (personResults().length == 0) {
          <section class="search-person-no-results">
            <p>
              <strong>{{ searchQuery() }}</strong> {{ noResultsText() }}
            </p>
          </section>
        } @else {
          <section class="search-person-controls">
            <app-display-selector
              [displayMode]="displayMode()"
              (onDisplayChange)="changeDisplay($event)"
            >
            </app-display-selector>
          </section>
          <section class="search-person-results">
            <p><strong>{{searchQuery()}}</strong> {{currentResultText()}}</p>
            <hr />
            @if (displayMode() == 'grid') {
              <app-search-person-grid
                [personResults]="personResults()"
                [itemsPerPage]="itemsPerPage()"
                [currentPage]="currentPage()"
                [totalResults]="totalResults()"
              >
              </app-search-person-grid>
            }
            @if (displayMode() == 'list') {
              <app-search-person-list
                [personResults]="personResults()"
                [itemsPerPage]="itemsPerPage()"
                [currentPage]="currentPage()"
                [totalResults]="totalResults()"
              >
              </app-search-person-list>
            }
            <hr />
            <app-pagination (pageChange)="changePage($event)"></app-pagination>
          </section>
        }
      </div>
    </main>
  }
</section>
