<section class="search-movie-grid">
  <div class="row">
    @for (
      movieResult of movieResults()
        | paginate
          : {
              itemsPerPage: itemsPerPage(),
              currentPage: currentPage(),
              totalItems: totalResults(),
            };
      track movieResult.id
    ) {
      <div class="col-12 col-sm-6 col-lg-3">
        <app-search-movie-result-grid [movieResult]="movieResult"> </app-search-movie-result-grid>
      </div>
    }
  </div>
</section>
