<section class="movie-video-gallery">
  @if (movieVideoGalleryError()) {
    <app-movie-error [errorMessage]="errorMessage()" (reload)="reloadVideoGallery($event)">
    </app-movie-error>
  } @else {
    <h2>{{ movieVideoGalleryTitle() }}</h2>
    <p>{{ movieVideoGalleryText() }}</p>
    <hr />
    @if (movieVideos().length > 0) {
      <app-movie-trailers [movieVideos]="movieVideos()"></app-movie-trailers>
      <app-movie-teasers [movieVideos]="movieVideos()"></app-movie-teasers>
      <app-movie-featurettes></app-movie-featurettes>
      <app-movie-behind-the-scenes></app-movie-behind-the-scenes>
    } @else {
      <p>{{noMovieVideosText()}}</p>
    }
  }
</section>
