<section class="movie-overview-synopsis">
  @if (movie().tagline) {
    <section class="movie-tagline">
      <p class="fst-italic">{{ movie().tagline }}</p>
    </section>
  }
  @if (movie().overview) {
    <section class="movie-overview">
      <p>{{ movie().overview }}</p>
    </section>
  }
  @if (!movie().tagline && !movie().overview) {
    <p class="fst-italic">{{ noSynopsisText() }}</p>
  }
</section>
