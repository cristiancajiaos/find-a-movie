@if (movieRecommendations().length > 0) {
  <section class="movie-overview-recommendations">
    <h2>{{ movieRecommendationsTitle() }}</h2>
    <div class="row">
      @for (
        movieRecommendation of movieRecommendations() | limitMovies: 4;
        track movieRecommendation.id
      ) {
        <div class="col-12 col-sm-6 col-lg-3">
          <app-search-movie-result-grid [movieResult]="movieRecommendation">
          </app-search-movie-result-grid>
        </div>
      }
      <div class="col-12 col-sm-6 col-lg-3"></div>
    </div>
    <div class="d-grid mb-2">
      <a [routerLink]="['/movie', movie().id, 'recommendations']" class="btn btn-light border-dark">
        {{moreRecommendationsText()}}
      </a>
    </div>
  </section>
  <hr/>
}
