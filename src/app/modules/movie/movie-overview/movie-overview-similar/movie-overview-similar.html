@if (similarMovies().length > 0) {
  <section class="movie-overview-similar">
    <h2>{{movieSimilarTitle()}}</h2>
    <div class="row">
      @for (similarMovie of similarMovies() | limitMovies: 4; track similarMovie.id) {
        <div class="col-12 col-sm-6 col-lg-3">
          <app-search-movie-result-grid [movieResult]="similarMovie">
          </app-search-movie-result-grid>
        </div>
      }
    </div>
    <div class="d-grid mb-2">
      <a [routerLink]="['/movie', movie().id, 'similar']" class="btn btn-light border-dark">
        {{moreSimilarText()}}
      </a>
    </div>
  </section>
}
