<section class="movie-overview-credits-menu">
  <div class="row">
    <div class="col-12 col-lg-4">
      <div class="d-grid mb-2">
        <a [routerLink]="['/movie', movie().id, 'cast']" class="btn btn-light border-dark">
          {{ viewFullCastText() }}
        </a>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="d-grid mb-2">
        <a [routerLink]="['/movie', movie().id, 'crew']" class="btn btn-light border-dark">
          {{ viewFeaturedCrewText() }}
        </a>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="d-grid mb-2">
        <a [routerLink]="['/movie', movie().id, 'full-crew']" class="btn btn-light border-dark">
          {{ viewFullCrewText() }}
        </a>
      </div>
    </div>
  </div>
</section>
