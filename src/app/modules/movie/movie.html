<section class="movie">
  @if (movieErrorFound()) {
    @if (movieNotFound()) {
      <app-movie-not-found></app-movie-not-found>
    } @else {
      <app-movie-error-fullscreen [errorMessage]="errorMessage()" (reload)="reloadMovie($event)">
      </app-movie-error-fullscreen>
    }
  } @else {
    @if (movieFound()) {
      <div class="navbar-cover"></div>
      <app-movie-header [movie]="movie()" [formattedTitle]="formattedTitle()" #movieHeader> </app-movie-header>
      <app-movie-nav></app-movie-nav>
      <main>
        <div class="container-fluid">
          <div class="row">
            <div class="col-12 col-lg-2">
              <app-movie-poster [movie]="movie()" [formattedTitle]="formattedTitle()"></app-movie-poster>
            </div>
            <div class="col-12 col-lg-10">
              <router-outlet></router-outlet>
            </div>
          </div>
        </div>
      </main>
    }
  }
</section>
