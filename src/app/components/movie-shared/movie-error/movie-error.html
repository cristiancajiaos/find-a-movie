<section class="movie-error">
  <h1>{{movieErrorTitle()}}</h1>
  <p>{{movieErrorText()}} <strong>{{errorMessage()}}</strong></p>
  <button type="button" class="btn btn-light border-dark mb-2" (click)="pressReload()">
    <fa-icon [icon]="repeat"></fa-icon> {{reloadButtonText()}}
  </button>
</section>
