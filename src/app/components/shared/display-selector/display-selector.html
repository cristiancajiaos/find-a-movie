<section class="display-selector">
  <div class="form-group mb-3">
    <label>Display:</label>
    <br />
    <div class="btn-group">
      <button
        type="button"
        class="btn border"
        (click)="toggleDisplay('grid')"
        ngbTooltip="as Grid"
        tooltipClass="display-selector-tooltip"
        [ngClass]="{ 'btn-primary': displayMode() == 'grid' }">
        <fa-icon [icon]="gridIcon"></fa-icon>
      </button>
      <button
        type="button"
        class="btn border"
        (click)="toggleDisplay('list')"
        ngbTooltip="as List"
        tooltipClass="display-selector-tooltip"
        [ngClass]="{ 'btn-primary': displayMode() == 'list' }">
        <fa-icon [icon]="listIcon"></fa-icon>
      </button>
    </div>
  </div>
</section>
