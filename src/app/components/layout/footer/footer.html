<footer [ngClass]="setClass()">
  <div class="row">
    <div class="col-12 col-lg-8">
      &#169; {{authorText()}}
      <br />
      {{usesAPIOneText()}}
      <a [href]="tmdbUrl" target="_blank">
        <img class="tmdb-logo" [src]="tmdbImg()" alt="TMDB Logo" />
      </a>
      {{usesAPITwoText()}}
    </div>
    <div class="col-12 col-lg-4 text-start text-lg-end">
      {{appVersionText()}}
    </div>
  </div>
</footer>
