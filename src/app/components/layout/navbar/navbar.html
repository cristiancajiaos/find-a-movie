<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">
      <fa-icon [icon]="filmIcon" [fixedWidth]="true"></fa-icon>
      {{appTitle()}}
    </a>
    <div
      class="collapse navbar-collapse d-flex justify-content-end"
      [ngbCollapse]="isMenuCollapsed"
    >
      <div ngbDropdown class="search-dropdown d-flex">
        <button
          class="btn border me-2"
          (click)="toggleLightDark()"
          ngbTooltip="Toggle Dark Mode"
          tooltipClass="btn-tooltip"
        >
          @if (isLight$ | async) {
            <fa-icon class="text-light" [icon]="darkIcon"></fa-icon>
          } @else {
            <fa-icon class="text-light" [icon]="lightIcon"></fa-icon>
          }
        </button>
        <button
          type="button"
          class="btn border text-light btn-select-search-type"
          id="selectSearchType"
          ngbDropdownToggle
        >
          @switch (searchType()) {
            @case ('movie') {
              <fa-icon [icon]="filmIcon" [fixedWidth]="true"></fa-icon> {{movieButtonText()}}
            }
            @case ('person') {
              <fa-icon [icon]="userIcon" [fixedWidth]="true"></fa-icon> {{personButtonText()}}
            }
          }
        </button>
        <div ngbDropdownMenu aria-labelledby="selectSearchType">
          <button ngbDropdownItem (click)="selectSearchType('movie')">
            <fa-icon [icon]="filmIcon" [fixedWidth]="true"></fa-icon>
            {{movieButtonText()}}
          </button>
          <button ngbDropdownItem (click)="selectSearchType('person')">
            <fa-icon [icon]="userIcon" [fixedWidth]="true"></fa-icon>
            {{personButtonText()}}
          </button>
        </div>
        @switch (searchType()) {
          @case ('movie') {
            <app-search-input-movie></app-search-input-movie>
          }
          @case ('person') {
            <app-search-input-person></app-search-input-person>
          }
        }
      </div>
    </div>
  </div>
</nav>
