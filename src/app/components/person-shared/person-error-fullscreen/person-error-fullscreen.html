<section class="person-error-fullscreen">
  <div class="dark-panel person-error-description">
    <h1>
      <fa-icon [icon]="circleXIcon" [fixedWidth]="true"></fa-icon>
      {{personErrorTitle()}}
    </h1>
    <hr/>
    <p>{{personErrorText()}}</p>
    <p><strong>{{ errorMessage() }}</strong></p>
    <hr/>
    <button type="button" class="btn btn-light border-dark" (click)="pressReload()">
      <fa-icon [icon]="repeat"></fa-icon> {{reloadButtonText()}}
    </button>
  </div>
</section>
