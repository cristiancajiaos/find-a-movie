<section class="search-input search-input-person">
  <form class="d-flex" role="search" (ngSubmit)="processPersonSearch()">
    <div ngbDropdown #personSearchDropdown="ngbDropdown" class="d-inline-block">
      <div class="input-group">
        <input
          #searchPersonInput
          class="input-person form-control"
          [ngClass]="setInputClass()"
          type="text"
          (search)="togglePersonSearchDropdownBySearch()"
          (focus)="togglePersonSearchDropdownByFocus()"
          [placeholder]="placeholder()"
          [aria-label]="ariaLabel()"
          [formControl]="personInput"
        />
        <button class="btn border button-clear-query" 
        [ngStyle]="styleDeleteQuery()" [ngClass]="setButtonDeleteQueryClass()" (click)="clearPersonQuery()" type="button">
          <fa-icon [icon]="deleteQueryIcon" [fixedWidth]="true"></fa-icon>
        </button>
        <button class="btn border" [ngClass]="setButtonSubmitClass()" type="submit">
          <fa-icon [icon]="searchIcon" [fixedWidth]="true"></fa-icon>
        </button>
      </div>
      <div
        ngbDropdownMenu
        class="dropdown-menu dropdown-search-movie"
        [ngClass]="{ 'dropdown-menu-end': dropdownMenuEnd() }"
      >
        @if (personResults().length > 0) {
          @for (person of personResults() | limitSearchPersonResults: 5; track person.id) {
            <app-search-input-person-result
              [personResult]="person"
              (clickResult)="goToPersonClose($event)"
            >
            </app-search-input-person-result>
          }
        }
        @if (personResults().length > 5) {
          <div class="dropdown-divider"></div>
          <a ngbDropdownItem class="view-all-results text-dark" (click)="processPersonSearch()">
            <fa-icon [icon]="resultsIcon" [fixedWidth]="true"></fa-icon>
            {{ viewAllResultsText() }}
          </a>
        }
        @if (personResults().length == 0) {
          @if (loadingResults()) {
            <app-search-input-loading></app-search-input-loading>
          } @else {
            <a ngbDropdownItem class="no-results-obtained">
            {{ noResultsObtainedText() }}
          </a>
          }
        }
      </div>
    </div>
  </form>
</section>
