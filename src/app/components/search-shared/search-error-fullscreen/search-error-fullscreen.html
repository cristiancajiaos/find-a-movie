<section class="search-error-fullscreen">
  <div class="dark-panel search-error-description">
    <h1>
      <fa-icon [icon]="circleXIcon" [fixedWidth]="true"></fa-icon>
      {{searchErrorTitle()}}
    </h1>
    <hr/>
    <p>{{searchErrorText()}} <strong>{{searchQuery()}}</strong>{{colonText()}}</p>
    <p><strong>{{ errorMessage() }}</strong></p>
    <hr/>
    <button type="button" class="btn btn-light border-dark" (click)="pressReload()">
      <fa-icon [icon]="repeatIcon"></fa-icon> {{reloadButtonText()}}
    </button>
  </div>
</section>
