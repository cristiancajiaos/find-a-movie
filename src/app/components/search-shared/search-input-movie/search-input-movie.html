<section class="search-input search-input-movie">
  <form class="d-flex" role="search" (ngSubmit)="processMovieSearch()">
    <div ngbDropdown #movieSearchDropdown="ngbDropdown" class="d-inline-block">
      <div class="input-group">
        <input
          #searchMovieInput
          class="input-movie form-control"
          [ngClass]="setInputClass()"
          type="text"
          (search)="toggleMovieSearchDropdownBySearch()"
          (focus)="toggleMovieSearchDropdownByFocus()"
          [placeholder]="placeholder()"
          [aria-label]="ariaLabel()"
          [formControl]="movieInput"
        />
        <button class="btn border button-clear-query"
        [ngStyle]="styleDeleteQuery()" [ngClass]="setButtonDeleteQueryClass()" (click)="clearMovieQuery()" type="button">
          <fa-icon [icon]="deleteQueryIcon" [fixedWidth]="true"></fa-icon>
        </button>
        <button class="btn border" [ngClass]="setButtonSubmitClass()" type="submit">
          <fa-icon [icon]="searchIcon" [fixedWidth]="true"></fa-icon>
        </button>
      </div>
      <div
        ngbDropdownMenu
        class="dropdown-menu dropdown-search-movie"
        [ngClass]="{ 'dropdown-menu-end': dropdownMenuEnd() }"
      >
        @if (movieResults().length > 0) {
          @for (movie of movieResults() | limitSearchMovieResults: 5; track movie.id) {
            <app-search-input-movie-result
              [movieResult]="movie"
              (clickResult)="goToMovieClose($event)"
            >
            </app-search-input-movie-result>
          }
        }
        @if (movieResults().length > 5) {
          <div class="dropdown-divider"></div>
          <a ngbDropdownItem class="view-all-results text-dark" (click)="processMovieSearch()">
            <fa-icon [icon]="resultsIcon" [fixedWidth]="true"></fa-icon>
            {{ viewAllResultsText() }}
          </a>
        }
        @if (movieResults().length == 0) {
          @if (loadingResults()) {
            <app-search-input-loading></app-search-input-loading>
          } @else {
            <a ngbDropdownItem class="no-results-obtained">
              {{ noResultsObtainedText() }}
            </a>
          }
        }
      </div>
    </div>
  </form>
</section>
