<a
  ngbDropdownItem
  class="search-result movie-result"
  [routerLink]="['/movie', movieResult().id]"
  (click)="onClickResult()"
>
  <span class="movie-poster">
    <div class="movie-poster-img" [ngStyle]="posterBgImage()"></div>
  </span>
  <span class="movie-formatted-title">
    {{ formattedTitle() }}
  </span>
</a>
