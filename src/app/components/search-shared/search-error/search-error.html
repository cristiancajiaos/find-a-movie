<section class="search-error">
  <h2>{{searchErrorTitle()}}</h2>
  <p>
    {{searchErrorText()}} <strong>{{ errorMessage() }}</strong>
  </p>
  <button type="button" class="btn btn-light border-dark" (click)="pressReload()">
    <fa-icon [icon]="repeatIcon"></fa-icon> {{reloadButtonText()}}
  </button>
</section>
